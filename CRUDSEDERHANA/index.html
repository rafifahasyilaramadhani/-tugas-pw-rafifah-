<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentApp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="header">
        <h1>📚 StudentApp</h1>
        <p>Data Siswa Digital</p>
    </div>


    <div class="card">

        <h2>Tambah Siswa</h2>

        <input type="text" id="nisn" placeholder="Masukkan NISN">

        <input type="text" id="nama" placeholder="Masukkan Nama Siswa">

        <input type="text" id="kelas" placeholder="Masukkan Kelas">


        <button onclick="tambahSiswa()">
            Simpan Data
        </button>

    </div>



    <div class="card">

        <h2>Daftar Siswa</h2>


        <table>

            <thead>
                <tr>
                    <th>No</th>
                    <th>NISN</th>
                    <th>Nama</th>
                    <th>Kelas</th>
                    <th>Aksi</th>
                </tr>
            </thead>


            <tbody id="tabelSiswa">

            </tbody>


        </table>


    </div>


</div>


<script src="app.js"></script>

</body>
</html>
